<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wadifaty.ma - البوابة الأولى لمتابعة مباريات التوظيف بالمغرب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        header {
            background: linear-gradient(135deg, #16324f 0%, #1e3d59 60%, #274c77 100%);
            color: white;
            padding: 28px 15px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 0.5px;
        }
        header p {
            margin: 8px 0 0;
            font-size: 16px;
            opacity: 0.95;
        }
        .search-box {
            width: 100%;
            max-width: 540px;
            padding: 12px 18px;
            font-size: 15px;
            border: none;
            border-radius: 25px;
            outline: none;
            text-align: right;
            box-shadow: 0 3px 8px rgba(0,0,0,0.22);
        }
        .container {
            width: 90%;
            max-width: 940px;
            margin: 30px auto;
        }
        .section-heading {
            margin: 0 0 14px;
            color: #1e3d59;
            font-size: 21px;
        }

        /* كباين القطاعات والوزارات */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 26px;
        }
        .sector-card {
            background-color: white;
            color: #1e3d59;
            border: 2px solid #dce5ee;
            border-radius: 12px;
            padding: 18px 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 105px;
        }
        .sector-card i {
            font-size: 24px;
            color: #1e3d59;
            transition: color 0.2s ease;
        }
        .sector-title {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.35;
        }
        .sector-sub {
            font-size: 11.5px;
            color: #5a6b7c;
            line-height: 1.3;
        }
        .sector-card:hover {
            border-color: #1e3d59;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(30, 61, 89, 0.12);
        }
        .sector-card.active {
            background-color: #1e3d59;
            border-color: #1e3d59;
            color: white;
            box-shadow: 0 6px 14px rgba(30, 61, 89, 0.22);
        }
        .sector-card.active i,
        .sector-card.active .sector-sub {
            color: #e8f0f8;
        }

        .job-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            border-right: 4px solid #1e3d59;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge-open {
            background-color: #e6f4ea;
            color: #137333;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 11px;
            border-radius: 15px;
            white-space: nowrap;
        }
        .job-title {
            margin: 0 0 10px;
            color: #1e3d59;
            font-size: 19px;
            line-height: 1.4;
        }
        .job-info p {
            margin: 6px 0;
            color: #444;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 18px;
            background-color: #1e3d59;
            color: white;
            border: none;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        .btn:hover {
            background-color: #142a3d;
        }
        .btn-secondary {
            background-color: #1b6b3a;
        }
        .btn-secondary:hover {
            background-color: #13502b;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.58);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-box {
            background: white;
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            text-align: right;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 14px;
            left: 16px;
            background: #f0f2f5;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: #333;
        }
        .modal-box h3 {
            margin: 0 0 12px;
            color: #1e3d59;
            padding-left: 34px;
            line-height: 1.4;
        }
