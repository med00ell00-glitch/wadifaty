<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wadifaty.ma - البوابة الأولى لمتابعة مباريات التوظيف بالمغرب</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        header {
            background-color: #1e3d59;
            color: white;
            padding: 26px 15px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 30px; }
        header p { margin: 8px 0 0; font-size: 15px; }
        .search-box {
            width: 100%;
            max-width: 520px;
            padding: 11px 16px;
            font-size: 14px;
            border: none;
            border-radius: 25px;
            outline: none;
            text-align: right;
            margin-top: 14px;
        }
        .container {
            width: 90%;
            max-width: 920px;
            margin: 26px auto;
        }
        .section-heading {
            margin: 0 0 14px;
            color: #1e3d59;
            font-size: 20px;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .sector-card {
            background: white;
            color: #1e3d59;
            border: 2px solid #dce5ee;
            border-radius: 10px;
            padding: 16px 12px;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .sector-card i { font-size: 22px; }
        .sector-title { font-size: 13.5px; font-weight: bold; }
        .sector-sub { font-size: 11px; color: #5a6b7c; }
        .sector-card.active {
            background: #1e3d59;
            border-color: #1e3d59;
            color: white;
        }
        .sector-card.active .sector-sub { color: #e8f0f8; }
        .ministry-bar {
            display: none;
            background: white;
            border: 1px solid #dce5ee;
            border-right: 4px solid #1b6b3a;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .ministry-link {
            background: #1b6b3a;
            color: white;
            text-decoration: none;
            padding: 7px 13px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .job-card {
            background: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            border-right: 4px solid #1e3d59;
        }
        .job-title { margin: 0 0 8px; color: #1e3d59; font-size: 18px; }
        .job-card p { margin: 5px 0; color: #444; font-size: 14px; }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 16px;
            background: #1e3d59;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13.5px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-secondary { background: #1b6b3a; }
        .no-results {
            display: none;
            background: white;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            color: #555;
            margin-bottom: 18px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-box {
            background: white;
            width: 100%;
            max-width: 540px;
            border-radius: 10px;
            padding: 22px;
            text-align: right;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            left: 14px;
            border: none;
            background: #eee;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        footer {
            background: #1e3d59;
            color: white;
            text-align: center;
            padding: 18px 15px;
            margin-top: 36px;
        }
        footer a { color: white; text-decoration: none; margin: 0 10px; font-weight: bold; }
        @media (max-width: 768px) {
            .filter-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .container { width: 94%; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Wadifaty.ma</h1>
        <p>البوابة الأولى لمتابعة مباريات التوظيف بالمغرب</p>
        <input type="text" id="searchBox" class="search-box" placeholder="ابحث عن مباراة، وزارة أو تخصص..." onkeyup="renderJobs()">
    </header>

    <div class="container">
        <h2 class="section-heading">تصفح حسب الوزارة والقطاع</h2>

        <div class="filter-grid">
            <button type="button" class="sector-card active" onclick="setCategory('all', this)">
                <i class="fa-solid fa-layer-group"></i>
                <span class="sector-title">الكل</span>
                <span class="sector-sub">جميع المباريات المتوفرة</span>
            </button>
            <button type="button" class="sector-card" onclick="setCategory('الداخلية', this)">
                <i class="fa-solid fa-landmark-flag"></i>
                <span class="sector-title">الداخلية والجماعات الترابية</span>
                <span class="sector-sub">الإدارة الترابية والقانون العام</span>
            </button>
            <button type="button" class="sector-card" onclick="setCategory('القضائ', this)">
                <i class="fa-solid fa-scale-balanced"></i>
                <span class="sector-title">العدل والمهن القضائية</span>
                <span class="sector-sub">المنتدبون والمساعدون القانونيون</span>
            </button>
            <button type="button" class="sector-card" onclick="setCategory('الصحة', this)">
                <i class="fa-solid fa-heart-pulse"></i>
                <span class="sector-title">الصحة والحماية الاجتماعية</span>
                <span class="sector-sub">الأطر الصحية والتقنية</span>
            </button>
            <button type="button" class="sector-card" onclick="setCategory('التعليم', this)">
                <i class="fa-solid fa-graduation-cap"></i>
                <span class="sector-title">التربية الوطنية والتعليم</span>
                <span class="sector-sub">التكوين والأساتذة والأطر</span>
            </button>
            <button type="button" class="sector-card" onclick="setCategory('عمومية', this)">
                <i class="fa-solid fa-building-columns"></i>
                <span class="sector-title">الإدارات والمؤسسات العمومية</span>
                <span class="sector-sub">المتصرفون والمناصب الإدارية</span>
            </button>
        </div>

        <div id="ministryBar" class="ministry-bar">
            <span id="ministryBarText"></span>
            <a id="ministryBarLink" href="#" target="_blank" rel="noopener noreferrer" class="ministry-link">الموقع الرسمي للوزارة</a>
        </div>

        <div id="noResults" class="no-results">لا توجد مباريات مطابقة حالياً.</div>
        <div id="jobsList"></div>

        <div style="background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-top: 20px;">
            <h3 style="color: #1e3d59; margin-top: 0;">اتصل بنا</h3>
            <p style="color: #555; margin: 0;">للاستفسار أو التواصل: <strong>contact@wadifaty.ma</strong></p>
        </div>
    </div>

    <div id="jobModal" class="modal-overlay" onclick="if(event.target.id==='jobModal') closeModal()">
        <div class="modal-box">
            <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle" style="color: #1e3d59; margin-top: 0;"></h3>
            <p id="modalOrgRow"><strong>الوزارة / المؤسسة:</strong> <span id="modalOrg"></span></p>
            <p id="modalDeadlineRow"><strong>آخر أجل:</strong> <span id="modalDeadline"></span></p>
            <p id="modalReqRow"><strong>شروط الترشيح:</strong> <span id="modalReq"></span></p>
            <div style="margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap;">
                <a id="modalApplyLink" href="https://www.emploi-public.ma/ar/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">الذهاب إلى إعلان المباراة</a>
